name: collect-prices
on:
  schedule:
    - cron: '17 6,18 * * *'   # 2x daily, offset from :00 to dodge GH cron congestion
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    # 2026-08-12 由 50 提到 90: 名单从 8,206 扩到 13,940 (wuko 批准, 补上详情页里
    # 缺价格图的那 49%)。实测模型 8,206 款 = 21min(三轮实测 21m12s/22m01s/21m36s),
    # 外推 13,940 款 ≈ 35min → 50min 只剩 30% 余量, Steam 慢一点就整轮 SIGTERM 而
    # 当天价格全丢。⚠ 名单现在由本机日更链每天重生成并 push, **会随详情页扩容继续涨**,
    # 扩页后回来重算这个值 (公开仓库 Actions 分钟免费, 提高它不花钱)。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Sample prices
        run: python3 collect.py
      - name: Commit data
        run: |
          git config user.name 'steamcozy-bot'
          git config user.email 'suggest@steamcozy.com'
          git add data
          git commit -m "price sample $(date -u +'%Y-%m-%d %H:%M') UTC" || { echo 'nothing to commit'; exit 0; }
          git push
